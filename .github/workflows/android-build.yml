      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpc-mk2-groovebox-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          script: timeout --signal=TERM --kill-after=10s 15m bash tests/android_ui_smoke.sh

      - name: Upload MPC UI visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpc-ui-visual-evidence
          path: |
            /tmp/mpc-groovebox-startup.png
            /tmp/mpc-groovebox-ui.xml
            /tmp/mpc-groovebox-browser.png
            /tmp/mpc-groovebox-browser-hierarchy.txt
            /tmp/mpc-groovebox-browser-uiautomator.xml
            /tmp/mpc-groovebox-storage-picker.png
            /tmp/mpc-groovebox-storage-picker-uiautomator.xml
            /tmp/mpc-groovebox-storage-picker-activity.txt
          if-no-files-found: warn
          archive: true
