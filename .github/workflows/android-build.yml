name: Android Build

on:
  push:
    branches:
      - main
      - "foundation/**"
      - "work/**"
  pull_request:

concurrency:
  group: android-build-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
          else
            echo "/dev/kvm is unavailable on this runner"
            exit 1
          fi

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -type f -name sdkmanager -print || true
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$SDKMANAGER_STATUS" -ne 0 ]; then
            echo "sdkmanager --licenses failed with status $SDKMANAGER_STATUS"
            exit "$SDKMANAGER_STATUS"
          fi

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          set +o pipefail
          yes | "$SDKMANAGER"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$SDKMANAGER_STATUS" -ne 0 ]; then
            echo "sdkmanager install failed with status $SDKMANAGER_STATUS"
            exit "$SDKMANAGER_STATUS"
          fi

      - name: Test AudioEngine header compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-tests
          c++ -std=c++20 -Wall -Wextra -Wno-unused-parameter -include cstring \
            -Ithird_party/oboe/include -Isrc \
            -c tests/AudioEngineHeaderCompileTests.cpp \
            -o build/native-tests/audio_engine_header_compile_tests.o

      - name: Test MPC Studio MkII MIDI decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-tests
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Isrc \
            tests/MpcStudioMk2InputDecoderTests.cpp \
            src/MPC/MpcStudioMk2InputDecoder.cpp \
            src/MPC/MpcStudioMk2ControlMap.cpp \
            src/MPC/MpcStudioMk2LedProtocol.cpp \
            -o build/native-tests/mpc_input_decoder_tests
          build/native-tests/mpc_input_decoder_tests

      - name: Test MPC Studio MkII Note Repeat timing
