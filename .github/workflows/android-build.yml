      - name: Validate Android UI smoke syntax and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/android_ui_smoke.sh
          python3 - <<'PY'
          import fnmatch
          import re
          from pathlib import Path

          smoke = Path("tests/android_ui_smoke.sh").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/android-build.yml").read_text(encoding="utf-8")
          helper_start = smoke.index('capture_ui_screenshot() {')
          helper_end = smoke.index("esac", helper_start) + len("esac")
          helper = smoke[helper_start:helper_end]

          patterns = []
          in_case = False
          for line in helper.splitlines():
              if 'case "$filename" in' in line:
                  in_case = True
                  continue
              if in_case and line.strip() == "*)":
                  break
              if not in_case:
                  continue
              item = line.strip().rstrip(chr(92)).strip()
              item = item.removesuffix("|").removesuffix(")").strip()
              if re.fullmatch(r"mpc-groovebox-[A-Za-z0-9.*_-]+[.]png", item):
                  patterns.append(item)

          required = sorted({
              match.group(1)
              for line in smoke.splitlines()
              if (match := re.search(r"test -s (/tmp/[A-Za-z0-9_.-]+[.]png)", line))
          })
          upload_marker = " " * 6 + "- name: Upload MPC UI visual evidence"
          upload = workflow.split(upload_marker, 1)[1]
          upload_patterns = [
              line.strip() for line in upload.splitlines()
              if line.strip().startswith("/tmp/")
          ]

          missing_capture = [
              path for path in required
              if not any(fnmatch.fnmatchcase(Path(path).name, pattern) for pattern in patterns)
          ]
          missing_upload = [
              path for path in required
              if not any(fnmatch.fnmatchcase(path, pattern) for pattern in upload_patterns)
          ]
          if missing_capture or missing_upload:
              if missing_capture:
                  print("Required smoke screenshots are not captured: " + ", ".join(missing_capture))
              if missing_upload:
                  print("Required smoke screenshots are not uploaded: " + ", ".join(missing_upload))
              raise SystemExit(1)
          print(
              f"Shell syntax OK; {len(required)} mandatory screenshot paths are "
              f"captured and uploaded. {len(patterns)} screenshot allowlist patterns."
          )
          PY

      - name: Run Android emulator smoke test
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          script: timeout --signal=TERM --kill-after=10s 32m bash tests/android_ui_smoke.sh

