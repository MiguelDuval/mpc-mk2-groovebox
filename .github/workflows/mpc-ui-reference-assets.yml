name: Vendor MPC UI reference screenshots

on:
  push:
    branches:
      - docs/mpc-ui-visual-reference-catalog-20261029
    paths:
      - tools/build_mpc_ui_reference_assets.py
      - .github/workflows/mpc-ui-reference-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpc-ui-reference-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-and-vendor:
    name: Download and render referenced MPC screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF and image tools
        run: python -m pip install --disable-pip-version-check pymupdf requests pillow beautifulsoup4

      - name: Download referenced images and render PDF page figures
        run: python tools/build_mpc_ui_reference_assets.py --root .

      - name: Upload generated gallery as recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpc-ui-reference-screenshots
          path: |
            docs/MPC3-UI-REFERENCE-ASSETS/
            docs/MPC3-UI-VISUAL-REFERENCE-CATALOG.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and push materialized screenshots to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MPC3-UI-REFERENCE-ASSETS docs/MPC3-UI-VISUAL-REFERENCE-CATALOG.md docs/MPC3-9-OS-KNOWLEDGE-BASE.md docs/MPC3-REFERENCE-INDEX.md
          if git diff --cached --quiet; then
            echo "No new screenshot assets or index changes."
            exit 0
          fi
          git commit -m "docs: vendor MPC UI reference screenshot assets [skip ci]"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
